# Container env file for the posttraining accelerate jobs.
# Image / mounts / workdir come from the launch script (recursive-unattended-accelerate.sh);
# this file adds the Slingshot/libfabric NCCL networking config + host-lib mounts.
# Networking config ported from the known-working ~/.edf/verl.toml.

mounts = [
  # Host libs the libfabric CXI provider dlopen's. Without these the OFI/CXI
  # plugin fails to load and NCCL can't use "AWS Libfabric".
  "/usr/lib64/libhwloc.so.15:/usr/lib/libhwloc.so.15",
  "/usr/lib64/libpciaccess.so.0:/usr/lib/libpciaccess.so.0",
  "/usr/lib64/libxml2.so.2:/usr/lib/libxml2.so.2",
  "/usr/lib64/libnuma.so.1:/usr/lib/libnuma.so.1",
]

[annotations]
com.hooks.aws_ofi_nccl.enabled = "true"
# Must match the CONTAINER's CUDA major. verl's container is cuda13; if this
# container is CUDA 13 and it still errors with "AWS Libfabric not found",
# change this to "cuda13".
com.hooks.aws_ofi_nccl.variant = "cuda12"
com.hooks.cxi.enabled = "true"

[env]
# --- Slingshot / libfabric CXI + aws-ofi-nccl (multi-node collective perf) ---
NCCL_NET = "AWS Libfabric"
NCCL_CROSS_NIC = "1"
NCCL_NET_GDR_LEVEL = "PHB"
NCCL_SOCKET_IFNAME = "hsn"
NCCL_PROTO = "^LL128"
FI_CXI_COMPAT = "0"
FI_CXI_RX_MATCH_MODE = "software"
FI_CXI_DEFAULT_CQ_SIZE = "131072"
FI_CXI_DEFAULT_TX_SIZE = "32768"
FI_CXI_DISABLE_HOST_REGISTER = "1"
FI_MR_CACHE_MONITOR = "userfaultfd"
OFI_NCCL_DISABLE_DMABUF = "1"
NCCL_DEBUG = "INFO"
